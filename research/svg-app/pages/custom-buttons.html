<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Buttons — SVG Icons</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .demo-section {
      margin-bottom: 2.5rem;
      max-width: 36rem;
    }

    .demo-title {
      font-size: 0.6875rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 1rem;
    }

    .demo-title span {
      font-size: 0.5rem;
      color: #444;
      margin-left: 0.5rem;
    }

    /* ── Top row: icon + diagram ── */
    .demo-top-row {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1rem;
    }

    .demo-icon-frame {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #222;
      border-radius: 6px;
      background: #141414;
      color: #bbb;
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .demo-icon-frame:hover {
      border-color: #333;
    }

    .demo-diagram-wrap {
      flex: 0 0 auto;
    }

    /* ── Settings row ── */
    .demo-settings {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.625rem;
      flex-wrap: wrap;
    }

    .demo-setting {
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .demo-setting label {
      font-size: 0.5rem;
      color: #3a3a3a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .demo-setting input[type="range"] {
      width: 6rem;
      accent-color: #555;
    }

    .demo-setting .val {
      font-size: 0.5625rem;
      color: #555;
      min-width: 2.5rem;
    }

    /* ── Skip button ── */
    .demo-skip-btn {
      background: none;
      border: 1px solid #2a2a2a;
      color: #555;
      font-size: 0.5rem;
      padding: 1px 6px;
      border-radius: 3px;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, opacity 0.15s;
      line-height: 1.3;
    }

    .demo-skip-btn:hover {
      color: #aaa;
      border-color: #555;
    }

    .demo-skip-btn.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ── Log ── */
    .demo-log {
      font-size: 0.5rem;
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      color: #3a3a3a;
      max-height: 5rem;
      overflow-y: auto;
      border: 1px solid #1a1a1a;
      border-radius: 3px;
      padding: 4px 6px;
      background: #0d0d0d;
      line-height: 1.7;
    }

    .demo-log .entry {
      white-space: nowrap;
    }

    .demo-log .entry .arrow {
      color: #333;
    }

    .demo-log .entry .mode {
      color: #2a2a2a;
    }
  </style>
</head>

<body>
  <div class="nav">
    <h1>Custom Buttons</h1>
    <a href="../index.html">Hub</a>
    <a href="browser.html">Browser</a>
  </div>

  <div id="app"></div>

  <script type="module" src="../src/custom-buttons.js"></script>
</body>

</html>
